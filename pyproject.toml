[project]
name = "indie-market-analyst"
version = "0.1.0"
description = "Open-source Indian-market analysis toolkit with intraday scanning, dashboards, backtesting, market data APIs, and optional AI-assisted chat."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Dharun Ashokkumar", email = "dharuna457@gmail.com" }]
keywords = [
    "indian-stock-market",
    "nse",
    "bse",
    "trading",
    "quant",
    "backtest",
    "backtesting",
    "intraday-trading",
    "stock-scanner",
    "market-data",
    "technical-analysis",
    "ai-agents",
    "openai-agents-sdk",
    "llm",
    "openrouter",
    "yfinance",
    "fintech",
    "agents",
    "multi-agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]

dependencies = [
    # openai-agents SDK (from PyPI) + LiteLLM extra for OpenRouter
    "openai-agents[litellm]>=0.14.2",
    "pydantic>=2.12.2,<3",
    # Service layer
    "fastapi>=0.110.0,<1",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    # Persistence
    "sqlalchemy>=2.0",
    "aiosqlite>=0.21.0",
    # Data / quant
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "yfinance>=0.2.40",
    "mcxlib>=0.3",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "playwright>=1.49.0",
    "pandas-ta>=0.3.14b",
    "scipy>=1.13.0",
    # Reporting
    "jinja2>=3.1.4",
    "weasyprint>=62.3",
    "matplotlib>=3.9.0",
    "plotly>=5.22.0",
]

[project.urls]
Homepage = "https://indiemarket.dharunashokkumar.com"
Documentation = "https://indiemarket.dharunashokkumar.com"
Repository = "https://github.com/dharunashokkumar/indie-market-analyst"
Issues = "https://github.com/dharunashokkumar/indie-market-analyst/issues"
Changelog = "https://github.com/dharunashokkumar/indie-market-analyst/releases"

[project.optional-dependencies]
viz = ["graphviz>=0.17"]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
indie-analyst = "indie_market_analyst.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["indie_market_analyst", "backtest", "intraday_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
isort = { combine-as-imports = true, known-first-party = ["indie_market_analyst", "backtest", "intraday_engine"] }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
