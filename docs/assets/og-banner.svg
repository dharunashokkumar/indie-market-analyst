<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1114;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1c2128;stop-opacity:1" />
    </linearGradient>
    <clipPath id="rect-clip">
      <rect x="0" y="0" width="1200" height="630" rx="0" />
    </clipPath>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg-grad)" />
  
  <!-- Abstract patterns -->
  <g opacity="0.1">
    <path d="M0 630 L400 200 L800 500 L1200 100" fill="none" stroke="#6aa7ff" stroke-width="2" />
    <path d="M0 500 L300 400 L700 600 L1200 300" fill="none" stroke="#6aa7ff" stroke-width="2" />
    <circle cx="1100" cy="100" r="150" fill="none" stroke="#6aa7ff" stroke-width="1" />
  </g>

  <!-- Content -->
  <g transform="translate(100, 200)">
    <!-- Logo placeholder or similar element -->
    <rect x="0" y="0" width="80" height="80" rx="16" fill="#6aa7ff" opacity="0.9" />
    <path d="M25 40 L35 50 L55 30" stroke="white" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="0" y="140" font-family="Source Serif 4, serif" font-size="64" font-weight="700" fill="#e6ebf2">indie-market-analyst</text>
    <text x="0" y="200" font-family="Inter, sans-serif" font-size="28" fill="#94a3b8">Intraday scans, dashboards, backtests, and optional AI chat.</text>
    
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="200" height="50" rx="8" fill="#6aa7ff" />
      <text x="100" y="32" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">GitHub Repository</text>
      
      <rect x="220" y="0" width="180" height="50" rx="8" fill="none" stroke="#2d333b" stroke-width="1" />
      <text x="310" y="32" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#e6ebf2" text-anchor="middle">MIT License</text>
    </g>
  </g>
  
  <!-- Subtle grid -->
  <g opacity="0.05">
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#e6ebf2" stroke-width="1" />
    <line x1="600" y1="0" x2="600" y2="630" stroke="#e6ebf2" stroke-width="1" />
  </g>
