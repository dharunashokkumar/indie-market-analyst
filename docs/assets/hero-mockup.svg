<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f5f4ef" rx="12" />
  
  <!-- Sidebar -->
  <rect width="280" height="800" fill="#faf9f5" />
  <line x1="280" y1="0" x2="280" y2="800" stroke="#e2e1db" stroke-width="1" />
  
  <!-- Sidebar Items -->
  <rect x="20" y="40" width="240" height="40" rx="6" fill="#e2e1db" opacity="0.5" />
  <text x="40" y="66" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Run Scan</text>
  
  <g transform="translate(20, 110)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#666" text-transform="uppercase">Workspace</text>
    <g transform="translate(0, 30)">
      <text x="0" y="0" font-family="Inter, sans-serif" font-size="14" fill="#1a1a1a">Intraday Scanner</text>
      <text x="0" y="40" font-family="Inter, sans-serif" font-size="14" fill="#666">Dashboards</text>
      <text x="0" y="80" font-family="Inter, sans-serif" font-size="14" fill="#666">Strategy</text>
      <text x="0" y="120" font-family="Inter, sans-serif" font-size="14" fill="#666">Chat</text>
    </g>
  </g>

  <!-- Main Content -->
  <g transform="translate(320, 60)">
    <text x="0" y="0" font-family="Source Serif 4, serif" font-size="18" font-weight="600" fill="#1a1a1a">Intraday Live Scan</text>
    
    <!-- User Message -->
    <g transform="translate(0, 60)">
      <text x="0" y="0" font-family="Inter, sans-serif" font-size="16" fill="#1a1a1a">Universe: Nifty 500 &middot; Source: NSE direct &middot; Mode: Live</text>
    </g>
    
    <!-- Scanner Response -->
    <g transform="translate(0, 120)">
      <!-- Reasoning Drawer -->
      <rect x="0" y="0" width="300" height="36" rx="6" fill="#f1f0eb" stroke="#e2e1db" stroke-width="1" />
      <path d="M12 18 L18 24 L24 18" stroke="#666" stroke-width="2" fill="none" transform="translate(0, -3)" />
      <text x="40" y="23" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#666">Fresh candles &middot; 6 detectors &middot; 18s</text>
      
      <!-- Tool Card -->
      <g transform="translate(0, 56)">
        <rect x="0" y="0" width="400" height="100" rx="8" fill="white" stroke="#e2e1db" stroke-width="1" />
        <rect x="0" y="0" width="4" height="100" fill="#2c6cdb" rx="4 0 0 4" />
        
        <text x="20" y="30" font-family="JetBrains Mono, monospace" font-size="13" fill="#666">scan_pick(symbol: "JSWSTEEL", direction: "LONG")</text>
        
        <g transform="translate(20, 65)">
          <text x="0" y="0" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#1a1a1a">0.78</text>
          <text x="78" y="0" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#16a34a">probability</text>
        </g>
      </g>
      
      <!-- Answer Prose -->
      <g transform="translate(0, 180)">
        <text x="0" y="0" font-family="Source Serif 4, serif" font-size="18" line-height="1.6" fill="#1a1a1a">
          <tspan x="0" dy="0">JSWSTEEL qualified after VWAP reclaim, momentum, and breakout detectors fired.</tspan>
          <tspan x="0" dy="28">Volume is above the configured average threshold and the pick is ranked in the</tspan>
          <tspan x="0" dy="28">top five for this scan. Click the row to inspect candles, VWAP, ORB levels,</tspan>
          <tspan x="0" dy="28">previous-day high/low, moving averages, volume MA, and pivots.</tspan>
        </text>
      </g>
    </g>
  </g>
  
  <!-- Input Area Mockup -->
  <g transform="translate(320, 700)">
    <rect x="0" y="0" width="840" height="60" rx="10" fill="white" stroke="#e2e1db" stroke-width="1" />
    <text x="20" y="36" font-family="Inter, sans-serif" font-size="16" fill="#666">Search symbols, scans, and runs...</text>
    <circle cx="810" cy="30" r="18" fill="#2c6cdb" />
    <path d="M802 30 L818 30 M810 22 L818 30 L810 38" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
